# Demo only. Users here have manual hashes:  echo 'my password' | ./auth --hash-password
# (or let people sign up and hash automatically: see examples/accounts and docs/authentication.md)
[auth]
required = true
cookie_secret = "demo-cookie-secret-change-me-0123456789"
redirect_uri = "http://127.0.0.1:8709/oauth2callback"

[auth.mock]
label = "Mock SSO"
client_id = "streamlitd-demo"
client_secret = "mock-secret"
server_metadata_url = "http://127.0.0.1:8790/.well-known/openid-configuration"

[auth.users.alice]
password_hash = "pbkdf2_sha256$200000$xgHJl/rAQQ6zRJuwW4AR1w==$CMWkvQX5nykREqzNBppOqEhGIYS2WRxWaBhbDxjpDsM="
name = "Alice"
email = "alice@example.com"
roles = ["admin"]          # config users can have roles too
