<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; display: flex; align-items: center; gap: .75rem; padding: .5rem 0; }
  button { border: 1px solid #888; background: transparent; color: inherit; border-radius: .5rem; padding: .3rem .9rem; cursor: pointer; font: inherit; }
</style>
</head>
<body>
<button id="btn">Click me</button>
<span id="label"></span>
<script>
  // Minimal Streamlit-protocol component (same messages as streamlit-component-lib).
  const send = (type, data) => window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, data || {}), "*");
  let count = 0;
  window.addEventListener("message", (e) => {
    if (!e.data || e.data.type !== "streamlit:render") return;
    const { args, theme } = e.data;
    document.getElementById("label").textContent = (args.label || "") + " (clicked " + count + " times)";
    if (theme) { document.body.style.color = theme.textColor; document.getElementById("btn").style.borderColor = theme.primaryColor; }
  });
  document.getElementById("btn").addEventListener("click", () => {
    count++;
    send("streamlit:setComponentValue", { value: { count }, dataType: "json" });
  });
  send("streamlit:componentReady", { apiVersion: 1 });
  send("streamlit:setFrameHeight", { height: 56 });
</script>
</body>
</html>
